<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cifra de César</title>
</head>
<body>
    <div class="container">
        <h1 class="title">Cifra de César</h1>
        
        <div class="section">
            <h2>Criptografar</h2>
            <input placeholder="Texto para criptografar" class="encrypt" type="text">
            <input placeholder="Chave (opcional)" class="key-encrypt" type="number" min="1" max="25">
            <button onclick="caesar_cipher_encrypt()">Criptografar</button>
        </div>
        
        <div class="section">
            <h2>Descriptografar</h2>
            <input placeholder="Texto para descriptografar" class="decrypt" type="text">
            <input placeholder="Chave (opcional)" class="key-decrypt" type="number" min="1" max="25">
            <button onclick="caesar_cipher_decrypt()">Descriptografar</button>
        </div>
        
        <p class="result"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
